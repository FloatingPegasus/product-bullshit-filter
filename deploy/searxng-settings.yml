use_default_settings:
  engines:
    keep_only: [google, duckduckgo]
server:
  secret_key: replace-with-random-server-secret
  limiter: false
  image_proxy: false
search:
  formats: [json]
  autocomplete: ""
  safe_search: 1
outgoing:
  request_timeout: 6.0
  max_request_timeout: 8.0
engines:
  - name: google
    disabled: false
  - name: duckduckgo
    disabled: false
